<!doctype html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080,height=1920"/>
<style>
html,body{width:1080px;height:1920px;margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:100%;height:100%}
video{width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:80px;pointer-events:none}
#subs{color:#fff;font-family:sans-serif;font-size:64px;font-weight:700;text-align:center;text-shadow:0 4px 20px rgba(0,0,0,0.8);max-width:900px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
<div id="stage">
<video src="assets/videos/target.mp4" autoplay muted playsinline></video>
<div id="overlay">
<div id="subs" class="clip" data-start="0" data-duration="15">Subtítulos automáticos</div>
</div>
</div>
</div>
</body>
</html>
