<!doctype html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080,height=1920"/>
<style>
html,body{width:1080px;height:1920px;margin:0;background:#000;overflow:hidden}

.shot{position:absolute;inset:0}

#subs{position:absolute;bottom:120px;left:0;width:100%;text-align:center;color:#fff;font-family:sans-serif;font-size:64px;font-weight:700;text-shadow:0 4px 20px rgba(0,0,0,0.8)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
<div id="stage">
<div class="clip" data-start="0" data-duration="15"><div class="shot"><img src="assets/img/frame_001.jpg"/></div></div>
<div id="subs" class="clip" data-start="0" data-duration="15">Subtítulos automáticos</div>
</div>
</div>
</body>
</html>
