name: Render
on:
  push:
    branches: [main]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Extract frames
        run: |
          mkdir -p assets/img
          ffmpeg -y -i assets/videos/target.mp4 -vf "fps=1" assets/img/frame_%03d.jpg
          if [ ! -f assets/img/frame_000.jpg ]; then
            ffmpeg -y -i assets/videos/target.mp4 -vframes 1 assets/img/frame_000.jpg
          fi
      - name: Generate placeholder subtitles (Spanish)
        run: |
          mkdir -p assets/subs
          cat > assets/subs/subtitles.es.srt << 'EOF'
          1
          00:00:00,000 --> 00:00:05,000
          Subtítulos automáticos en español
          EOF
      - name: Render
        run: |
          npx --yes hyperframes@0.8.204 check
          mkdir -p out
          npx --yes hyperframes@0.8.204 render --output out/video.mp4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
